# 보스 무브 시트 템플릿. 복사해서 bosses/<boss>.yaml로 만든다.
# 시간 단위는 tick (1 tick = 1/20초). 애니메이션, AI, 데이터팩 타이밍은 이 값과 같아야 한다.
boss: template_knight
name: 템플릿 기사
status: draft            # 사람이 승인하면 approved
timing_unit: tick
hp: 2400
poise: 180
moves:
  - id: overhead_slam
    telegraph_frames: 18   # 예비 동작: 플레이어가 읽는 구간
    active_frames: [22, 26]  # 판정 구간 (시작, 끝)
    recovery_frames: 30    # 후딜: 반격 기회
    damage: 38
    poise_damage: 45
    punish_window: true
    animation: null        # Epic Fight 애니메이션 경로가 정해지면 기록
