# 버전 고정 목록. 에이전트는 기억이 아니라 이 파일을 기준으로 API와 형식을 고른다.
# status: pinned(확정) / to_verify(설치 전 다시 확인) / avoid(쓰지 않음)
# 근거: docs/research/README.md, docs/research/sources/
checked: "2026-10-13"
minecraft: "1.21.1"
java: 21
loader:
  name: neoforge
  version: "21.1.259"   # maven.neoforged.net 기준 1.21.1 최신 (2026-10-13)

mods:
  epic_fight:
    version: "21.17.3.1"
    status: pinned
    source: https://www.curseforge.com/minecraft/mc-mods/epic-fight-mod
    note: 1.21.1 NeoForge 최신판 (2026-05-31)
  geckolib:
    version: "4.9.3"
    status: to_verify
    source: https://www.curseforge.com/minecraft/mc-mods/geckolib
    note: 1.21.1용 4.x 계열. 5.x는 1.21.11 이상 전용
  # Iris와 Sodium은 짝이 맞아야 한다. 1.21.1 NeoForge에는 두 조합만 있다 (Modrinth API 확인, 2026-10-14).
  #   A안(안정): Iris 1.8.12 + Sodium 0.6.13. 둘 다 정식판이지만 Sodium 0.8 백포트의 성능 개선이 없다.
  #   B안(성능): Iris 1.8.14-beta.1 + Sodium 0.8.13. Sodium은 정식판, Iris는 베타이고 블록 엔티티 그림자 버그(Iris #3283)가 있다.
  # 사용자 PC 벤치마크(G6)로 고른다. 이전에 적었던 Iris 1.8.13은 1.21.1용으로 출시된 적이 없다.
  sodium:
    version: "0.8.13"
    status: to_verify
    source: https://modrinth.com/mod/sodium/versions?g=1.21.1
    note: B안. A안이면 0.6.13
  iris:
    version: "1.8.14-beta.1"
    status: to_verify
    source: https://modrinth.com/mod/iris/versions?g=1.21.1
    note: B안(Sodium 0.8 대응 베타, #3283 있음). A안이면 1.8.12 + Sodium 0.6.13
  weapons_of_miracles:
    version: "2.0.178"
    status: to_verify
  kubejs:
    version: "2101.7.2-build.377"
    status: to_verify

tools:
  blockbench:
    version: "5.2.2"
    status: pinned
    note: 최소 버전. Animated Java는 5.1.4 이상 필요
  blockbench_mcp:
    version: "v1.10.0"
    status: pinned
    source: https://github.com/jasonjgardner/blockbench-mcp-plugin
    note: tools/mcp/bbmodel-headless.mjs와 같은 버전으로 유지
  geckolib_blockbench_plugin:
    version: "4.2.5"
    status: pinned
  animated_java:
    version: "1.11.0"
    status: pinned
    note: Blockbench 플러그인. 블루프린트의 대상 버전은 1.21.1
  blender:
    version: "5.0"
    status: to_verify
    note: Epic Fight 공식 익스포터가 지원하는 최대 버전 기준
  node:
    version: ">=23.6"
    status: pinned
    note: 헤드리스 bbmodel 렌더에 필요. PC는 24 LTS 권장
  codex_cli:
    version: ">=0.161"
    status: pinned
    note: 0.161부터 기본 모델 gpt-6.1-sol. codex mcp-server는 제거됨
